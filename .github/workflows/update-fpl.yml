name: Update FPL League Scores

on:
  schedule:
    # Runs once a week on Tuesday at 18:00 UTC (adjust hour if you want 6:00 PM local/AEDT)
    - cron: "0 18 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Download & overwrite active season scores
        run: python update_fpl_data.py

      - name: Run end-of-season Monte Carlo simulation
        run: python simulate_season.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpl_history.csv data/predictions.csv
          if git diff --staged --quiet; then
            echo "No changes to data files."
          else
            git commit -m "chore(fpl): refresh 2026-2027 scores and season predictions"
            git push
          fi
