name: Update FPL League Scores

on:
  schedule:
    # Runs at 08:00 UTC (7:00 PM AEDT) on Mon, Tue, Fri, Sat, Sun
    # Adjust times/days to match when FPL finalizes gameweeks & bonus points
    - cron: "0 8 * * 1,2,5,6,7"
  workflow_dispatch: {} # Lets you trigger a manual run anytime from the Actions tab

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Download & overwrite active season scores
        run: python update_fpl_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpl_history.csv
          if git diff --staged --quiet; then
            echo "No changes to data/fpl_history.csv."
          else
            git commit -m "chore(fpl): refresh 2026-2027 league scores"
            git push
          fi